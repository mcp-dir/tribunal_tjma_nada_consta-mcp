name: tribunal_tjma_nada_consta-mcp
displayName: "Tribunal TJMA: Nada Consta"
description: >
  Tribunal TJMA: Nada Consta, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/tribunal_tjma_nada_consta-mcp
repository: https://github.com/mcp-dir/tribunal_tjma_nada_consta-mcp

tags:
  - tribunal_tjma_nada_consta
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_tribunal_tjma_nada_consta

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_tribunal_tjma_nada_consta/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
